<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - 页面未找到</title>
<style>
  body { margin:0; font-family: "Segoe UI","Microsoft YaHei",Tahoma,sans-serif;
         background:#ece9d8; display:flex; align-items:center; justify-content:center;
         min-height:100vh; }
  .win { width:420px; background:#ece9d8; border:1px solid #0831d9;
         border-radius:8px 8px 0 0; box-shadow:2px 2px 12px rgba(0,0,0,.4); overflow:hidden; }
  .title { background:linear-gradient(180deg,#0058ee 0%,#3f8cf3 8%,#0054e3 40%,#0050d0 88%,#0046bc 100%);
           color:#fff; font-size:13px; font-weight:bold; padding:5px 8px;
           display:flex; justify-content:space-between; align-items:center;
           text-shadow:1px 1px 1px rgba(0,0,0,.5); }
  .btns { display:flex; gap:2px; }
  .btns span { width:21px; height:21px; display:flex; align-items:center; justify-content:center;
               background:linear-gradient(180deg,#4d9bf5,#0050d0); border:1px solid #fff;
               border-radius:3px; font-size:11px; }
  .body { padding:20px 24px; display:flex; gap:16px; align-items:flex-start; }
  .icon { font-size:42px; line-height:1; }
  h1 { font-size:15px; margin:0 0 8px; color:#000; }
  p { font-size:12px; margin:0 0 6px; color:#333; line-height:1.6; }
  .path { font-family:Consolas,monospace; background:#fff; border:1px solid #7f9db9;
          padding:2px 6px; font-size:11px; word-break:break-all; }
  .foot { background:#ece9d8; border-top:1px solid #d4d0c8; padding:8px 24px;
          text-align:right; }
  a.btn { display:inline-block; min-width:72px; text-align:center; font-size:12px;
          padding:4px 14px; color:#000; text-decoration:none;
          background:linear-gradient(180deg,#fff,#ece9d8); border:1px solid #003c74;
          border-radius:3px; box-shadow:inset 0 0 0 1px #fff; }
  a.btn:hover { background:linear-gradient(180deg,#f5f8ff,#ccddf5); }
</style>
</head>
<body>
  <div class="win">
    <div class="title">
      <span>hicard.world</span>
      <span class="btns"><span>_</span><span>□</span><span>✕</span></span>
    </div>
    <div class="body">
      <div class="icon">🗂️</div>
      <div>
        <h1>找不到该页面</h1>
        <p>Windows 无法找到此文件或页面，请检查路径是否正确。</p>
        <p class="path" id="p"></p>
      </div>
    </div>
    <div class="foot">
      <a class="btn" href="/">返回首页</a>
    </div>
  </div>
  <script>
    try { document.getElementById('p').textContent = location.pathname; } catch(e){}
  </script>
</body>
</html>
