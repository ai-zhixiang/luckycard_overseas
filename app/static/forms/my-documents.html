<style>
* { margin:0; padding:0; box-sizing:border-box; }
.md-root { position:absolute; inset:0; display:flex; flex-direction:column;
  background:#ECE9D8; font-family:'Tahoma','Segoe UI',sans-serif; font-size:11px; color:#000; user-select:none; overflow:hidden; }
/* toolbar */
.md-tb { display:flex; align-items:center; gap:2px; padding:3px 4px; background:#ECE9D8; border-bottom:1px solid #D4D0C8; flex-wrap:wrap; }
.md-btn { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; font-family:'Tahoma',sans-serif; font-size:11px;
  background:linear-gradient(180deg,#fff,#ECE9D8); border:1px solid #8E8F8A; border-radius:3px; cursor:pointer; color:#000; white-space:nowrap; }
.md-btn:hover { border-color:#003399; }
.md-btn:active { background:linear-gradient(180deg,#D4D0C8,#ECE9D8); }
.md-btn:disabled { opacity:.5; cursor:default; }
.md-btn img { width:16px; height:16px; }
.md-sep { width:1px; height:18px; background:#C0BFAF; margin:0 4px; }
/* warning banner */
.md-warn { display:none; padding:7px 10px; font-size:11px; line-height:1.5; color:#000;
  background:linear-gradient(180deg,#FFF1A8,#FFDD55); border-bottom:1px solid #D9A500;
  align-items:center; gap:10px; }
.md-warn .w-ico { font-size:16px; }
.md-warn button { margin-left:auto; flex-shrink:0; }
/* path */
.md-path { padding:4px 8px; background:#FFFFFF; border-bottom:1px solid #D4D0C8; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* column header + list */
.md-grid { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.md-row { display:flex; align-items:center; gap:6px; padding:2px 8px; white-space:nowrap; }
.md-row.head { background:#F4F2E4; border-bottom:1px solid #D4D0C8; font-weight:bold; }
.md-row.item { cursor:default; }
.md-row.item.sel { background:#316AC5; color:#fff; }
.md-row.item img { width:16px; height:16px; flex-shrink:0; }
.md-list { flex:1; overflow:auto; }
.c-name { flex:2 1 45%; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
.c-size { flex:0 0 70px; text-align:right; overflow:hidden; }
.c-type { flex:0 0 90px; overflow:hidden; }
.c-mod { flex:0 0 110px; overflow:hidden; }
/* status bar */
.md-status { border-top:1px solid #D4D0C8; padding:3px 8px; font-size:11px; display:flex; gap:16px; }
/* editor pane */
.md-edit { position:absolute; inset:0; display:none; flex-direction:column; background:#fff; }
.md-edit textarea { flex:1; border:0; resize:none; outline:none; padding:6px; font-family:'Lucida Console','Consolas',monospace; font-size:13px; }
.md-edit-bar { display:flex; align-items:center; gap:6px; padding:3px 6px; background:#ECE9D8; border-bottom:1px solid #D4D0C8; }
.md-edit-bar .fname { font-weight:bold; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.md-empty { padding:24px; text-align:center; color:#666; }
/* modal */
.md-modal-bg { position:absolute; inset:0; background:rgba(0,0,0,.25); display:none; align-items:center; justify-content:center; z-index:50; }
.md-modal { width:340px; background:#ECE9D8; border:1px solid #003399; box-shadow:2px 2px 8px rgba(0,0,0,.4); }
.md-modal .mt { display:flex; align-items:center; gap:6px; padding:5px 8px; background:linear-gradient(90deg,#0055E4,#3A8DFF); color:#fff; font-weight:bold; }
.md-modal .mb { padding:12px; }
.md-modal input { width:100%; padding:4px; font-family:Tahoma,sans-serif; font-size:12px; border:1px solid #7F9DB9; outline:none; }
.md-modal .mb p { margin-bottom:8px; }
.md-modal .mbtns { display:flex; justify-content:flex-end; gap:6px; padding:8px 12px; }
.md-modal .mbtns button { min-width:72px; padding:4px 10px; font-family:Tahoma,sans-serif; font-size:11px;
  background:linear-gradient(180deg,#fff,#ECE9D8); border:1px solid #8E8F8A; border-radius:3px; cursor:pointer; }
.md-modal .mbtns button:active { background:linear-gradient(180deg,#D4D0C8,#ECE9D8); }
</style>

<div class="md-root" id="mdRoot">
  <div class="md-tb">
    <button class="md-btn" id="btnBack" title="Back"><img src="/static/img/xp-mydocs_20.png?v=2">Back</button>
    <button class="md-btn" id="btnUp" title="Up one level"><img src="/static/img/xp-mydocs_20.png?v=2" style="transform:rotate(90deg)">Up</button>
    <div class="md-sep"></div>
    <button class="md-btn" id="btnNewFolder" title="Create a new folder"><img src="/static/img/xp-folder_20.png?v=2">New Folder</button>
    <button class="md-btn" id="btnNewTxt" title="Create a new text document"><img src="/static/img/xp-notepad_20.png?v=2">New Text Doc</button>
    <div class="md-sep"></div>
    <button class="md-btn" id="btnDelete" title="Delete the selected item" disabled><img src="/static/img/xp-recycle_20.png?v=2">Delete</button>
    <button class="md-btn" id="btnZip" title="Download all files as a ZIP"><img src="/static/img/my_documents_20.png?v=2">Download All</button>
    <button class="md-btn" id="btnRefresh" title="Refresh">Refresh</button>
  </div>
  <div class="md-warn" id="mdWarn">
    <span class="w-ico">⚠</span>
    <span id="mdWarnText"></span>
    <button class="md-btn" id="btnWarnZip">Download All Now</button>
  </div>
  <div class="md-path" id="mdPath"></div>
  <div class="md-grid">
    <div class="md-row head">
      <span class="c-name">Name</span><span class="c-size">Size</span><span class="c-type">Type</span><span class="c-mod">Modified</span>
    </div>
    <div class="md-list" id="mdList"><div class="md-empty">Loading…</div></div>
  </div>
  <div class="md-status" id="mdStatus"></div>
</div>

<div class="md-edit" id="mdEdit">
  <div class="md-edit-bar">
    <img src="/static/img/xp-notepad_20.png?v=2" style="width:16px;height:16px">
    <span class="fname" id="edName"></span>
    <button class="md-btn" id="edSave">Save</button>
    <button class="md-btn" id="edClose">Close</button>
  </div>
  <textarea id="edText" spellcheck="false"></textarea>
</div>

<div class="md-modal-bg" id="mdModalBg">
  <div class="md-modal">
    <div class="mt"><img src="/static/img/xp-mydocs_20.png?v=2" style="width:18px;height:18px"><span id="mTitle">My Documents</span></div>
    <div class="mb"><p id="mMsg">Name:</p><input id="mInput" type="text" maxlength="80"></div>
    <div class="mbtns"><button id="mOk">OK</button><button id="mCancel">Cancel</button></div>
  </div>
</div>

<script>
(function(){
  var IC = { folder:'/static/img/xp-folder_20.png?v=2', txt:'/static/img/xp-notepad_20.png?v=2',
             file:'/static/img/xp-documents.svg', up:'/static/img/xp-folder_20.png?v=2' };
  var state = { path:'', sel:null, items:[], status:null, editing:false };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function api(url, opts){
    return fetch(url, opts).then(function(r){
      if (r.status === 403 || r.status === 413) {
        return r.text().then(function(t){ throw new Error(t.replace(/^.*?"detail":"?/,'').replace(/"?\}$/,'').trim() || 'Permission denied'); });
      }
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    });
  }
  function postForm(url, obj){
    var fd = new FormData();
    Object.keys(obj).forEach(function(k){ fd.append(k, obj[k]); });
    return api(url, { method:'POST', body: fd });
  }

  function fmtDate(ts){
    var d = new Date(ts * 1000);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---- modal ---- */
  var modalCb = null;
  function showModal(title, msg, value, cb){
    $('mTitle').textContent = title; $('mMsg').textContent = msg; $('mInput').value = value;
    $('mdModalBg').style.display = 'flex';
    $('mOk').onclick = function(){ hideModal(); cb($('mInput').value); };
    $('mCancel').onclick = function(){ hideModal(); };
    setTimeout(function(){ $('mInput').focus(); $('mInput').select(); }, 30);
  }
  function hideModal(){ $('mdModalBg').style.display = 'none'; }

  /* ---- list / status ---- */
  function renderPath(){
    var parts = state.path ? state.path.split('/') : [];
    var p = 'My Documents';
    if (parts.length) p += ' › ' + parts.join(' › ');
    $('mdPath').textContent = p;
  }
  function render(){
    var list = $('mdList');
    renderPath();
    if (!state.items.length){ list.innerHTML = '<div class="md-empty">This folder is empty.</div>'; }
    else {
      var html = '';
      state.items.forEach(function(it){
        html += '<div class="md-row item" data-path="' + esc(it.path) + '">' +
          '<span class="c-name"><img src="' + (it.is_dir ? IC.folder : it.kind==='txt' ? IC.txt : IC.file) + '">' + esc(it.name) + '</span>' +
          '<span class="c-size">' + esc(it.size_display) + '</span>' +
          '<span class="c-type">' + (it.is_dir ? 'File Folder' : it.kind==='txt' ? 'Text Document' : 'File') + '</span>' +
          '<span class="c-mod">' + fmtDate(it.mtime) + '</span></div>';
      });
      list.innerHTML = html;
      Array.prototype.forEach.call(list.querySelectorAll('.md-row.item'), function(row){
        row.addEventListener('click', function(){
          list.querySelectorAll('.md-row.item').forEach(function(r){ r.classList.remove('sel'); });
          row.classList.add('sel');
          state.sel = row.dataset.path;
          $('btnDelete').disabled = false;
        });
        row.addEventListener('dblclick', function(){ openItem(state.items.filter(function(i){ return i.path === row.dataset.path; })[0]); });
      });
    }
    if (state.sel){ $('btnDelete').disabled = false; }
  }
  function load(){
    api('/api/userfiles/list?path=' + encodeURIComponent(state.path)).then(function(d){
      state.items = d.items;
      state.sel = null; $('btnDelete').disabled = true;
      render();
      refreshStatus(true);
    }).catch(function(e){ $('mdList').innerHTML = '<div class="md-empty">' + esc(e.message) + '</div>'; });
  }
  function refreshStatus(silent){
    api('/api/userfiles/status').then(function(st){
      state.status = st;
      var warn = $('mdWarn');
      var freeTxt = 'My Documents: ' + st.count + ' of ' + st.limit_files + ' files, ' + st.size_display + ' of ' + st.limit_display + ' used';
      var sel = state.sel ? '1 object selected' : (state.items.length + (state.items.length===1?' object':' objects'));
      $('mdStatus').innerHTML = '<span>' + esc(sel) + '</span><span>' + esc(freeTxt) + '</span>';
      if (st.over && st.wipe_at){
        var left = Math.max(0, st.seconds_left);
        var mm = Math.floor(left/60), ss = left%60;
        $('mdWarnText').innerHTML = '⚠ <b>Storage limit reached</b> (' + st.count + ' files / ' + st.size_display +
          ' — free limit is ' + st.limit_files + ' files / ' + st.limit_display + '). ALL files will be permanently deleted in <b id="warnLeft">' + mm + ':' + (ss<10?'0':'') + ss + '</b>. Download everything to your computer now!';
        warn.style.display = 'flex';
      } else { warn.style.display = 'none'; }
    }).catch(function(){});
  }
  function tick(){
    if (state.status && state.status.over && state.status.wipe_at){
      var el = $('warnLeft');
      var left = Math.max(0, state.status.wipe_at - Math.floor(Date.now()/1000));
      if (left <= 0){ load(); return; }
      if (el) el.textContent = Math.floor(left/60) + ':' + (left%60<10?'0':'') + (left%60);
    }
  }

  /* ---- actions ---- */
  function nav(path){ state.path = path; load(); }
  function up(){ if (!state.path) return; var parts = state.path.split('/'); parts.pop(); nav(parts.join('/')); }

  function createTxt(){
    showModal('New Text Document', 'File name:', 'New Text Document.txt', function(v){
      if (!v) return;
      postForm('/api/userfiles/touch', { name: v, parent: state.path }).then(load).catch(function(e){ alert(e.message); });
    });
  }
  function createFolder(){
    showModal('New Folder', 'Folder name:', 'New Folder', function(v){
      if (!v) return;
      postForm('/api/userfiles/mkdir', { name: v, parent: state.path }).then(load).catch(function(e){ alert(e.message); });
    });
  }
  function removeItem(){
    if (!state.sel) return;
    var it = state.items.filter(function(i){ return i.path === state.sel; })[0];
    showModal('Confirm File Delete', 'Are you sure you want to delete "' + (it? it.name : state.sel) + '"?', '', function(){
      postForm('/api/userfiles/delete', { path: state.sel }).then(load).catch(function(e){ alert(e.message); });
    });
    // clear the prefilled input so confirm box isn't editable
    $('mInput').style.display = 'none';
  }
  function openItem(it){
    if (!it) return;
    if (it.is_dir){ nav(it.path); return; }
    if (it.kind === 'txt'){
      api('/api/userfiles/read?path=' + encodeURIComponent(it.path)).then(function(d){
        $('edName').textContent = d.name + ' — Notepad';
        $('edText').value = d.content;
        $('mdRoot').style.display = 'none';
        $('mdEdit').style.display = 'flex';
        state.editing = it.path;
        $('edText').focus();
      }).catch(function(e){ alert(e.message); });
    } else {
      // binary / other → single-file download
      downloadBlob('/api/userfiles/download?path=' + encodeURIComponent(it.path), it.name);
    }
  }
  function saveText(){
    if (!state.editing) return;
    postForm('/api/userfiles/save', { path: state.editing, content: $('edText').value })
      .then(function(){ closeEditor(true); }).catch(function(e){ alert(e.message); });
  }
  function closeEditor(keepList){
    $('mdEdit').style.display = 'none';
    $('mdRoot').style.display = 'flex';
    state.editing = null;
    if (!keepList) load();
  }
  function downloadBlob(url, filename){
    fetch(url).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    }).then(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = filename || 'download';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }).catch(function(e){ alert(e.message); });
  }
  function zipAll(){
    downloadBlob('/api/userfiles/zip', 'MyDocuments.zip');
  }

  /* ---- wire up ---- */
  $('btnBack').onclick = function(){ if (state.path){ up(); } };
  $('btnUp').onclick = up;
  $('btnNewFolder').onclick = createFolder;
  $('btnNewTxt').onclick = createTxt;
  $('btnDelete').onclick = removeItem;
  $('btnZip').onclick = zipAll;
  $('btnWarnZip').onclick = zipAll;
  $('btnRefresh').onclick = load;
  $('edSave').onclick = saveText;
  $('edClose').onclick = function(){ closeEditor(false); };
  $('edText').addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); saveText(); }
  });

  // make sure confirm modal input hidden state resets
  var origShow = showModal;
  showModal = function(t, m, v, cb){
    $('mInput').style.display = '';
    $('mMsg').style.display = '';
    origShow(t, m, v, cb);
  };

  load();
  setInterval(tick, 1000);
})();
</script>
