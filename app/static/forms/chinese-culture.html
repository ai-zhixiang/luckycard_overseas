<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Culture</title>
<style>
/* Root fills the window body (inset:0 escapes the body padding) so the button
   bar is pinned at the bottom and NEVER falls below the fold, no matter how
   long the topic text is. */
.cc-root {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: #ECE9D8;
  font-family: 'Tahoma', 'Segoe UI', sans-serif;
  font-size: 12px; color: #000;
  overflow: hidden;
}
.cc-scroll { flex: 1; overflow: auto; padding: 14px 16px 0; }
.cc-foot {
  flex: 0 0 auto;
  padding: 8px 16px 8px;
  background: #ECE9D8;
  border-top: 1px solid #D4D0C8;
  display: none;
}
/* 顶部横幅 */
.banner {
  background: linear-gradient(180deg, #B3202C, #8E1520);
  color: #fff;
  border-radius: 3px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #7A1019;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
}
.banner .flag { font-size: 26px; line-height: 1; }
.banner .titles { flex: 1; }
.banner .t-zh { font-size: 19px; font-weight: bold; letter-spacing: 1px; }
.banner .t-en { font-size: 11px; opacity: .85; margin-top: 2px; font-style: italic; }
.banner .date {
  text-align: right; font-size: 10px; opacity: .8; line-height: 1.4;
}
/* 内容纸面 */
.paper {
  margin-top: 12px;
  background: #FBF6E7;
  border: 1px solid #D8CFAE;
  border-radius: 2px;
  padding: 16px 18px;
  box-shadow: inset 0 0 0 1px #fff, 0 1px 3px rgba(0,0,0,.08);
}
.seg-zh { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 15px; line-height: 1.9; color: #2A1F12; }
.seg-zh::first-letter { font-size: 21px; }
.seg-en {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px dashed #C9BD97;
  font-family: Georgia, 'Times New Roman', serif; font-size: 13px;
  line-height: 1.75; color: #3D3323;
}
.seg-label {
  display: inline-block; font-family: Tahoma, sans-serif;
  font-size: 10px; color: #8E6A2F; font-weight: bold;
  letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase;
}
/* 状态区 */
#status {
  text-align: center; color: #666; padding: 40px 10px;
  font-family: Tahoma, sans-serif;
}
.spinner {
  display: inline-block; width: 20px; height: 20px; margin-right: 8px;
  border: 2px solid #C0B49A; border-top-color: #8E1520; border-radius: 50%;
  vertical-align: middle;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: #B00020; padding: 12px; text-align: center; }
/* 底部工具条 */
.toolbar { display: flex; justify-content: flex-end; gap: 8px; }
.xp-btn {
  background: linear-gradient(180deg, #fff 0%, #ECE9D8 100%);
  border: 1px solid #7F9DB9; border-radius: 3px;
  padding: 4px 14px; font: 12px Tahoma, sans-serif; cursor: pointer;
}
.xp-btn:hover { background: linear-gradient(180deg, #F3E8C8, #ECE9D8); }
.xp-btn:disabled { opacity: .55; cursor: default; }
.foot-note {
  margin-top: 6px; font-size: 10px; color: #999; text-align: right;
  font-family: Tahoma, sans-serif;
}
</style>
</head>
<body>
<div class="cc-root">
  <div class="cc-scroll" id="ccScroll">
    <div id="status"><span class="spinner"></span>Fetching today's culture…</div>
  </div>
  <div class="cc-foot" id="ccFoot">
    <div class="toolbar" id="ccToolbar"></div>
    <div class="foot-note">One topic per day &middot; facts from Wikipedia, written by DeepSeek</div>
  </div>
</div>

<script>
(function () {
  var scroll = document.getElementById('ccScroll');
  var foot = document.getElementById('ccFoot');
  var toolbar = document.getElementById('ccToolbar');
  // 记在 sessionStorage: 刷新页面(以及关窗再开)后还停在你选的那个主题上;
  // 关掉标签页/浏览器重开 → 回到今日主题.
  var KEY = 'lc_culture_off';

  function off() {
    var v = parseInt(sessionStorage.getItem(KEY) || '0', 10);
    return (isNaN(v) || v < 0) ? 0 : v;
  }
  function setOff(n) {
    try { sessionStorage.setItem(KEY, String(n)); } catch (e) {}
  }

  function render(d) {
    var zh = (d.zh || '').replace(/</g, '&lt;');
    var en = (d.en || '').replace(/</g, '&lt;');
    var escT = (d.title_en || '').replace(/</g, '&lt;');
    scroll.innerHTML =
      '<div class="banner">' +
        '<div class="flag">&#127464;&#127475;</div>' +
        '<div class="titles">' +
          '<div class="t-zh">' + (d.title_zh || '') + '</div>' +
          '<div class="t-en">' + escT + '</div>' +
        '</div>' +
        '<div class="date">' + (d.date || '') + '</div>' +
      '</div>' +
      '<div class="paper">' +
        '<span class="seg-label">&#20013;&#25991; &middot; Chinese</span>' +
        '<div class="seg-zh">' + zh + '</div>' +
        '<div class="seg-en"><span class="seg-label">English</span><br>' + en + '</div>' +
      '</div>' +
      '<div style="height:14px"></div>';

    toolbar.innerHTML =
      (off() > 0 ? '<button class="xp-btn" id="btn-today">Today\'s topic</button>' : '') +
      '<button class="xp-btn" id="btn-another">Another topic</button>';
    foot.style.display = 'block';

    // 每个按钮只绑一次点击 —— 不要用 document 级委托: 表单每次注入都会再加一个监听器,
    // 一次点击跑两遍 load(), 两个响应抢着渲染, 结果就是"点了没换主题".
    document.getElementById('btn-another').onclick = function () {
      setOff(off() + 1);
      load();
    };
    var tb = document.getElementById('btn-today');
    if (tb) { tb.onclick = function () { setOff(0); load(); }; }
    scroll.scrollTop = 0;
  }

  function fail(msg) {
    foot.style.display = 'none';
    scroll.innerHTML = '<div class="err">' + (msg || 'Failed to load') +
      '<br><br><button class="xp-btn" id="btn-retry">Retry</button></div>';
    var rb = document.getElementById('btn-retry');
    if (rb) { rb.onclick = load; }
  }

  function load() {
    foot.style.display = 'none';
    scroll.innerHTML = '<div id="status"><span class="spinner"></span>Fetching culture…</div>';
    var want = off();
    fetch('/api/culture/today?offset=' + want)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (want !== off()) { return; }   // 用户已经点了别的主题, 丢弃这个迟到的响应
        if (res.ok && res.j && res.j.zh) { render(res.j); return; }
        fail((res.j && res.j.detail) || 'Empty result');
      })
      .catch(function () {
        if (want !== off()) { return; }
        fail('Network error');
      });
  }

  load();
})();
</script>
</body>
</html>
